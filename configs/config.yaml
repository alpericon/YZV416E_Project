model:
  # SAM 2 variant: hiera_t (tiny), hiera_s (small), hiera_b+ (base plus), hiera_l (large)
  variant: hiera_b+
  # Path to the model config file inside the SAM 2 repo
  config: configs/sam2/sam2_hiera_b+.yaml
  # Path to the downloaded checkpoint
  checkpoint: checkpoints/sam2_hiera_base_plus.pt
  # Hugging Face model ID (alternative to local checkpoint)
  hf_model_id: facebook/sam2-hiera-base-plus

data:
  davis_root: data/DAVIS
  resolution: 1024
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  # Splits are defined by DAVIS ImageSets/2017/{split}.txt
  train_split: train
  val_split: val

augmentation:
  enabled: true
  brightness_factor: 0.3      # ±30% brightness jitter
  horizontal_flip_prob: 0.5
  crop_scale: [0.8, 1.0]      # random crop between 80–100% of original
  gaussian_noise_std: 0.02    # σ for Gaussian noise
  motion_blur_kernel: 15      # kernel size for motion blur filter
  motion_blur_prob: 0.3       # probability of applying motion blur

training:
  # Which layers to train (backbone is always frozen)
  trainable_modules: [sam_mask_decoder]
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  num_epochs: 10
  batch_size: 1               # 1 sequence per step
  grad_accumulation_steps: 4  # effective batch = 4
  max_grad_norm: 1.0
  warmup_steps: 100
  # Loss weights
  dice_loss_weight: 1.0
  focal_loss_weight: 20.0
  iou_loss_weight: 1.0
  # Checkpoint saving
  save_every_n_epochs: 2
  checkpoint_dir: checkpoints/finetune

evaluation:
  split: val
  output_dir: results
  save_masks: true
  save_visualizations: true
  # Number of sequences to visualize qualitatively (null = all)
  num_viz_sequences: 10

device: cuda   # cuda or cpu
seed: 42
